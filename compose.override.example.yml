# Merge with an existing Immich v3.4.0 stack. Retain its database, Redis,
# volumes, networks, machine-learning image and configuration.
services:
  immich-server:
    image: local/immich-server:rkmpp-3.4.0-r4-memories
    pull_policy: never
    devices:
      - /dev/dri:/dev/dri
      - /dev/mpp_service:/dev/mpp_service
      - /dev/rga:/dev/rga
      - /dev/dma_heap:/dev/dma_heap
      - /dev/mali0:/dev/mali0
    volumes:
      - /etc/OpenCL:/etc/OpenCL:ro
      - /usr/lib/aarch64-linux-gnu/libmali.so.1:/usr/lib/aarch64-linux-gnu/libmali.so.1:ro
