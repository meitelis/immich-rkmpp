name: Source and build checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Focused source regressions
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          node --check scripts/prepare-source.mjs
          node --check scripts/verify-hardware.mjs
          sh -n scripts/build.sh scripts/deploy.sh scripts/rollback.sh
          python3 - <<'PY'
          import pathlib,re
          for name in ('build.sh','deploy.sh','rollback.sh'):
              script = pathlib.Path('scripts', name)
              for block in re.findall(r"<<'PY'\n(.*?)\nPY", script.read_text(), re.S):
                  compile(block, str(script), 'exec')
          PY
      - name: Pinned server and browser build
        run: sh scripts/build.sh --source-dir "$RUNNER_TEMP/immich-rkmpp-source"
      - name: Real fragment and shared-audio checks with the candidate FFmpeg
        run: |
          mkdir -p "$RUNNER_TEMP/playback-fragments"
          docker run --rm --entrypoint node \
            -v "$PWD:/source:ro" -v "$RUNNER_TEMP/playback-fragments:/scratch" -w /source \
            -e IMMICH_FFMPEG_BIN=ffmpeg -e IMMICH_FFPROBE_BIN=ffprobe \
            -e IMMICH_PLAYBACK_SCRATCH=/scratch \
            -e IMMICH_COMPILED_MEDIA=/usr/src/app/server/dist/utils/media.js \
            local/immich-server:rkmpp-3.3.5-r4-memories \
            --test tests/playback-fragments.test.mjs
